org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=false
org.gradle.configuration-cache=false

# Shared Mod Properties
# Fork version: keep the upstream 1.1.7.1 lineage visible, then identify this
# independently maintained NoFingerprint release. Fabric/Gradle already accepted
# the four-component upstream version; the pre-release suffix is compatible.
mod_version=1.1.7.1-nofingerprint.2-beta.1
maven_group=io.github.dimaniojk.nofingerprint

# Fabric Loader (shared across versions)
loader_version=0.19.3

# Loom version (must be the same for ALL version targets to avoid classloader conflicts)
loom_version=1.17.11

# Acknowledge Stonecutter Groovy-DSL advisory (build.gradle is Groovy by design); silence the nag.
dev.kikugie.stonecutter.hard_mode=true
